name: yobante_colis
description: |
  Yobante Colis est l'application d'envoi de colis entre la France et le Sénégal. Préparez votre expédition, faites enlever votre colis à domicile et suivez-le jusqu'à sa livraison, directement depuis votre téléphone.

  ▸ UN DEVIS EN QUELQUES SECONDES
  Indiquez la destination, le poids et le type de colis : le tarif s'affiche immédiatement. Consultez les tarifs, les services et les emballages disponibles avant de vous décider.

  ▸ UNE EXPÉDITION GUIDÉE PAS À PAS
  Renseignez l'expéditeur et le destinataire, ajoutez des photos de votre colis et même un message vocal pour le décrire. Retrouvez vos adresses habituelles dans votre carnet d'adresses.

  ▸ ENLÈVEMENT À DOMICILE OU POINT DE COLLECTE
  Choisissez un créneau pour qu'un agent vienne chercher votre colis chez vous, ou déposez-le dans l'un de nos points de collecte. Les tournées de collecte sont consultables dans l'application.

  ▸ SUIVI DE VOS COLIS
  Suivez chaque étape de l'acheminement, des colis que vous envoyez comme de ceux que vous recevez. Un simple numéro de suivi suffit pour consulter l'état d'un colis.

  ▸ NOTIFICATIONS À CHAQUE ÉTAPE
  Soyez prévenu dès que votre colis change d'étape : prise en charge, transit, arrivée, livraison.

  ▸ DOCUMENTS ET PAIEMENTS
  Téléchargez vos étiquettes, bordereaux et factures. Consultez vos paiements en cours et votre historique. Moyens de paiement acceptés : Orange Money, Wave, Free Money et carte bancaire.

  ▸ UN SERVICE CLIENT À L'ÉCOUTE
  Une question ou un problème ? Ouvrez une réclamation et échangez avec notre équipe depuis l'application. Une FAQ répond aussi aux questions les plus fréquentes.

  ▸ VOS DONNÉES VOUS APPARTIENNENT
  Connexion sécurisée, données protégées. Vous pouvez exporter vos données ou supprimer votre compte à tout moment depuis l'application.

  Disponible en français et en anglais.
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^9.2.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  dartz: ^0.10.1
  image_picker: ^1.0.7
  toastification: ^3.0.3
  firebase_core: ^4.10.0
  firebase_crashlytics: ^5.2.3
  firebase_messaging: ^16.3.0
  jwt_decode: ^0.3.1
  dio: ^5.8.0+1
  media_store_plus: ^0.1.3
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
  record: ^7.1.1
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_yobante.png"
  adaptive_icon_background: "#F5C518"
  adaptive_icon_foreground: "assets/images/logo_yobante.png"
