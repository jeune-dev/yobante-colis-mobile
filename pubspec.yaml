name: yobnate_colis
description: "Yobnate Colis — Application mobile de gestion de colis et livraisons."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^9.2.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  dartz: ^0.10.1
  image_picker: ^1.0.7
  toastification: ^3.0.3
  firebase_core: ^4.10.0
  firebase_crashlytics: ^5.2.3
  firebase_messaging: ^16.3.0
  jwt_decode: ^0.3.1
  dio: ^5.8.0+1
  media_store_plus: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_yobante.png"
  adaptive_icon_background: "#F5C518"
  adaptive_icon_foreground: "assets/images/logo_yobante.png"
