name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Analyse statique + tests unitaires ──────────────────────────────────────
  test:
    name: Analyse & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5' # même version que android-release.yml
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le formatage
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyse statique (flutter analyze)
        run: flutter analyze --no-fatal-infos

      - name: Tests unitaires
        run: flutter test --coverage --reporter=github

      # Seuil = couverture réelle actuelle (12 %) : empêche de régresser ; à relever au fil des nouveaux tests
      - name: Vérifier la couverture minimale (12%)
        run: |
          # Lignes couvertes (LH) / lignes instrumentées (LF), sommées sur tous les fichiers de lcov.info
          COVERAGE=$(awk -F: '/^LF:/{total+=$2} /^LH:/{hit+=$2} END{if (total>0) printf "%d", (hit*100)/total; else print 0}' coverage/lcov.info)
          echo "Couverture : ${COVERAGE}%"
          if [ "$COVERAGE" -lt 12 ]; then
            echo "❌ Couverture insuffisante : ${COVERAGE}% (minimum 12%)"
            exit 1
          fi
          echo "✅ Couverture OK : ${COVERAGE}%"

  # ── Build Android (sur push main uniquement) ─────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5' # même version que android-release.yml
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      # Même secret que android-release.yml. Sans lui, Firebase est simplement
      # désactivé dans ce build (voir android/app/build.gradle.kts) : un fichier
      # vide ferait au contraire échouer la compilation.
      - name: Créer google-services.json depuis le secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON_BASE64 absent : build sans Firebase."
          fi

      - name: Build APK debug
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yobante-colis-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
