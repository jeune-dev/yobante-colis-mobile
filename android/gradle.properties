# Machine : 7 Go RAM — Gradle daemon à 2,5 Go pour absorber JetifyTransform sur les JARs Flutter
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Performances de build
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false

android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
